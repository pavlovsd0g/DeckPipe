<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DeckPipe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./styles.css">
</head>
<body data-min-width="1000" data-min-height="640">
<header>
  <div class="brand" aria-label="DeckPipe">
    <h1>Deck<span>Pipe</span></h1>
    <p>local DJ library bridge</p>
  </div>
  <button class="ghost" id="btnLoginDeezer" type="button" data-action="open-login" data-service="deezer">Deezer: вход</button>
  <button class="ghost" id="btnLoginSc" type="button" data-action="open-login" data-service="sc">SC: вход</button>
  <div id="settings" role="group" aria-label="Настройки библиотеки">
    <label class="sr-only" for="wavMode">Режим хранения скачанных файлов</label>
    <select id="wavMode" data-action="save-wav-mode" title="Режим хранения скачанных файлов">
      <option value="source">Исходный формат</option>
      <option value="wav">WAV (+ исходник)</option>
      <option value="wav_delete">WAV (удалять исходник)</option>
    </select>
    <label class="sr-only" for="musicRoot">Корень библиотеки</label>
    <input id="musicRoot" placeholder="Корень библиотеки (общая папка, напр. E:\Music)" aria-label="Корень библиотеки">
    <button class="ghost" type="button" data-action="save-root">Сохранить</button>
    <button class="ghost" type="button" data-action="send-report">🐞 Багрепорт</button>
  </div>
</header>
<div id="statusRegion" class="live-region hidden" role="status" aria-live="polite"></div>
<div id="errorRegion" class="live-region error-region hidden" role="alert" aria-live="assertive"></div>
<main>
  <aside id="side" aria-label="Навигация по источникам">
    <nav id="tabs" aria-label="Разделы">
      <button id="tab-deezer" class="active" type="button" data-action="switch-tab" data-tab="deezer">Deezer</button>
      <button id="tab-sc" type="button" data-action="switch-tab" data-tab="sc">SoundCloud</button>
      <button id="tab-search" type="button" data-action="switch-tab" data-tab="search">Поиск</button>
      <button id="tab-errors" type="button" data-action="switch-tab" data-tab="errors">Ошибки</button>
    </nav>
    <div id="sc-add">
      <label class="sr-only" for="scUrl">URL плейлиста/страницы SoundCloud</label>
      <input id="scUrl" placeholder="URL плейлиста/страницы SoundCloud (необязательно)" aria-label="URL плейлиста или страницы SoundCloud">
      <button type="button" data-action="add-sc-source" aria-label="Добавить источник SoundCloud">+</button>
    </div>
    <div id="playlists" aria-live="polite"></div>
  </aside>
  <section id="content" aria-label="Рабочая область">
    <div id="toolbar" class="hidden" role="toolbar" aria-label="Действия плейлиста">
      <div class="playlist-heading">
        <div id="pltitle"></div>
        <div id="plpath"></div>
      </div>
      <span id="plstats" class="dim" aria-live="polite"></span>
      <label class="dim label-compact" title="Файлы с номерами: 01 - Artist - Title">
        <input type="checkbox" id="numbering" data-action="save-numbering"> NN
      </label>
      <button class="ghost" type="button" data-action="rescan">Пересканировать</button>
      <button class="ghost" type="button" data-action="bind-path">Папка плейлиста…</button>
      <button type="button" data-action="download-selected">Скачать выбранные</button>
      <button type="button" data-action="sync-playlist-order" title="Перенумеровать файлы по порядку в стриминге и докачать недостающие">Синк: по порядку</button>
      <button type="button" data-action="sync-append" title="Не трогать текущие номера, новые треки — вниз списка">Синк: новые вниз</button>
      <button class="ghost" type="button" data-action="rb-sync" title="Синхронизировать скачанные треки в Rekordbox (Rekordbox должен быть закрыт)">→ RB</button>
      <button class="ghost" id="flipBtn" type="button" data-action="flip-wav" title="Конвертировать плейлист в WAV для CDJ с сохранением всех кью/сетки (Rekordbox закрыт)">⇄ WAV</button>
    </div>
    <div id="searchbar" class="hidden" role="search">
      <label class="sr-only" for="searchInput">Трек, альбом или исполнитель</label>
      <input id="searchInput" placeholder="Трек, альбом или исполнитель…" aria-label="Трек, альбом или исполнитель">
      <label class="sr-only" for="searchService">Сервис поиска</label>
      <select id="searchService" aria-label="Сервис поиска">
        <option value="both">Deezer + SC</option>
        <option value="deezer">Deezer</option>
        <option value="sc">SoundCloud</option>
      </select>
      <button type="button" data-action="run-search">Найти</button>
    </div>
    <div id="searchFilters" role="toolbar" aria-label="Фильтры поиска">
      <button class="chip active" type="button" data-action="set-search-filter" data-filter="all" data-f="all">Все</button>
      <button class="chip" type="button" data-action="set-search-filter" data-filter="tracks" data-f="tracks">Треки</button>
      <button class="chip" type="button" data-action="set-search-filter" data-filter="albums" data-f="albums">Альбомы</button>
      <button class="chip" type="button" data-action="set-search-filter" data-filter="playlists" data-f="playlists">Плейлисты/Сеты</button>
      <button class="chip" type="button" data-action="set-search-filter" data-filter="artists" data-f="artists">Исполнители</button>
    </div>
    <div id="tracks" tabindex="-1"><div id="empty"><div class="empty-title">Выберите плейлист слева</div></div></div>
  </section>
</main>
<div id="jobs" role="status" aria-live="polite"></div>

<div id="modalOverlay" class="hidden" data-action="overlay-close">
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle" tabindex="-1">
    <div class="modal-head">
      <h2 id="loginTitle"></h2>
      <button class="ghost icon-button" type="button" data-action="close-login" aria-label="Закрыть вход">×</button>
    </div>
    <div id="loginSteps"></div>
    <div id="loginPasswordBlock" class="hidden">
      <label class="sr-only" for="loginEmail">Email Deezer</label>
      <input id="loginEmail" class="login-input login-input-gap" placeholder="Email Deezer" autocomplete="username">
      <label class="sr-only" for="loginPassword">Пароль Deezer</label>
      <input id="loginPassword" class="login-input" type="password" placeholder="Пароль" autocomplete="current-password">
    </div>
    <label class="sr-only" for="loginToken">Токен входа</label>
    <input id="loginToken" class="login-input" placeholder="" aria-describedby="loginSteps">
    <div class="login-actions">
      <button type="button" data-action="do-login">Войти</button>
      <span id="loginResult" aria-live="polite"></span>
    </div>
    <div id="scImport" class="hidden">
      <div class="section-caption">Импортировать в источники:</div>
      <div id="scAccountList"></div>
      <button class="button-offset" type="button" data-action="import-sc-account">Импортировать выбранные</button>
    </div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
