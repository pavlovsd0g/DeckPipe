<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DeckPipe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#14151a; --panel:#1d1f26; --panel2:#23252e; --text:#e8e9ed; --dim:#9aa0ae;
          --accent:#7c6cff; --ok:#3fce7c; --err:#ff5c6c; --warn:#ffb648; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.45 "Segoe UI",system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden;}
  header { display:flex; align-items:center; gap:16px; padding:10px 16px; background:var(--panel); border-bottom:1px solid #2c2f3a; }
  header h1 { font-size:18px; font-weight:600; }
  header h1 span { color:var(--accent); }
  #user { color:var(--dim); font-size:12px; }
  #settings { margin-left:auto; display:flex; gap:8px; align-items:center; }
  #settings input { width:340px; background:var(--panel2); border:1px solid #343743; color:var(--text); padding:6px 10px; border-radius:6px; }
  button { background:var(--accent); color:#fff; border:0; padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; }
  select { background:var(--panel2); border:1px solid #343743; color:var(--text); padding:6px 8px; border-radius:6px; font-size:13px; }
  button.ghost { background:var(--panel2); border:1px solid #3a3e4c; }
  button:disabled { opacity:.5; cursor:default; }
  main { flex:1; display:flex; min-height:0; }
  #playlists { width:300px; min-width:300px; overflow-y:auto; background:var(--panel); border-right:1px solid #2c2f3a; padding:8px; }
  #tabs { display:flex; gap:6px; padding:8px; background:var(--panel); }
  #tabs button { flex:1; background:var(--panel2); border:1px solid #3a3e4c; color:var(--dim); }
  #tabs button.active { background:#2b2447; border-color:var(--accent); color:var(--text); }
  #sc-add { display:none; gap:6px; padding:0 8px 8px; }
  #sc-add input { flex:1; background:var(--panel2); border:1px solid #343743; color:var(--text); padding:6px 10px; border-radius:6px; min-width:0; }
  #side { width:300px; min-width:300px; display:flex; flex-direction:column; background:var(--panel); border-right:1px solid #2c2f3a; }
  .pl { display:flex; gap:10px; align-items:center; padding:8px; border-radius:8px; cursor:pointer; }
  .pl:hover { background:var(--panel2); }
  .pl.active { background:#2b2447; outline:1px solid var(--accent); }
  .pl img { width:44px; height:44px; border-radius:6px; object-fit:cover; background:#333; }
  .pl .t { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pl .c { color:var(--dim); font-size:12px; }
  .pl .badge-err { color:var(--err); font-size:12px; }
  #content { flex:1; display:flex; flex-direction:column; min-width:0; }
  #toolbar { display:flex; gap:10px; align-items:center; padding:10px 16px; border-bottom:1px solid #2c2f3a; background:var(--panel); }
  #toolbar .spacer { flex:1; }
  #pltitle { font-size:16px; font-weight:600; }
  #plpath { color:var(--dim); font-size:12px; }
  #tracks { flex:1; overflow-y:auto; padding:8px 16px; }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:6px 8px; text-align:left; border-bottom:1px solid #262933; }
  th { color:var(--dim); font-weight:500; font-size:12px; position:sticky; top:0; background:var(--bg); }
  tr.sel { background:#262a38; }
  .st { font-size:15px; }
  .ok { color:var(--ok); } .err { color:var(--err); } .miss { color:var(--dim); }
  .fmt { font-size:11px; padding:1px 6px; border-radius:4px; background:#313646; color:#c9d2ff; text-transform:uppercase; }
  .fmt.mp3 { background:#463431; color:#ffc9c0; }
  .errtext { color:var(--err); font-size:11px; }
  #jobs { background:var(--panel); border-top:1px solid #2c2f3a; padding:8px 16px; max-height:140px; overflow-y:auto; }
  .job { margin:4px 0; font-size:12px; }
  .bar { height:6px; background:#2c2f3a; border-radius:3px; overflow:hidden; margin-top:3px; }
  .bar i { display:block; height:100%; background:var(--accent); transition:width .3s; }
  .dim { color:var(--dim); }
  #empty { padding:40px; text-align:center; color:var(--dim); }
  #modalOverlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:100; }
  #modal { background:var(--panel); border:1px solid #343743; border-radius:12px; padding:18px; width:520px; max-width:92vw; }
  .scacc { display:flex; gap:8px; align-items:center; padding:4px 0; font-size:13px; }
  #searchbar { display:flex; gap:8px; padding:10px 16px; background:var(--panel); border-bottom:1px solid #2c2f3a; }
  #searchbar input { flex:1; background:var(--panel2); border:1px solid #343743; color:var(--text); padding:7px 12px; border-radius:6px; }
  #searchFilters { display:none; gap:6px; padding:8px 16px; background:var(--panel); border-bottom:1px solid #2c2f3a; flex-wrap:wrap; }
  .chip { background:var(--panel2); border:1px solid #3a3e4c; color:var(--dim); padding:4px 12px; border-radius:20px; font-size:12px; cursor:pointer; }
  .chip.active { background:#2b2447; border-color:var(--accent); color:var(--text); }
  .search-sec { padding:12px 16px 4px; font-weight:600; color:var(--accent); }
  .srow { display:flex; align-items:center; gap:8px; padding:5px 16px; border-bottom:1px solid #262933; }
  .srow .tt { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .srow button { padding:3px 10px; font-size:12px; flex-shrink:0; }
  .srow .meta { color:var(--dim); font-size:12px; white-space:nowrap; }
  .srow .cb { flex-shrink:0; }
  .srow.exp { cursor:pointer; }
  .srow.exp:hover { background:var(--panel2); }
  .prov { font-size:10px; padding:1px 6px; border-radius:4px; background:#313646; color:#c9d2ff; flex-shrink:0; }
  .prov.sc { background:#463431; color:#ffc9c0; }
  .stracks { background:#191b21; border-bottom:1px solid #262933; }
  .stracks .srow { padding-left:34px; }
  #basket { position:sticky; bottom:0; display:flex; gap:10px; align-items:center; padding:10px 16px;
            background:#23263a; border-top:1px solid var(--accent); }
  #targetBox { padding:8px; border-bottom:1px solid #2c2f3a; background:var(--panel2); }
  #targetBox .cap { font-size:11px; color:var(--dim); margin-bottom:4px; }
  #targetBox .cur { font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-bottom:6px; }
  #targetBox .acts { display:flex; gap:4px; flex-wrap:wrap; }
  #targetBox .acts button { padding:3px 8px; font-size:11px; }
  #tabs { flex-wrap:wrap; }
  #tabs button { min-width:0; padding:7px 4px; font-size:12px; }
  .pl { min-width:0; }
  .pl > div { min-width:0; }
  #toolbar { flex-wrap:wrap; }
</style>
</head>
<body>
<header>
  <h1>Deck<span>Pipe</span></h1>
  <button class="ghost" id="btnLoginDeezer" onclick="openLogin('deezer')">Deezer: вход</button>
  <button class="ghost" id="btnLoginSc" onclick="openLogin('sc')">SC: вход</button>
  <div id="settings">
    <select id="wavMode" onchange="saveWavMode()" title="Режим хранения скачанных файлов">
      <option value="source">Исходный формат</option>
      <option value="wav">WAV (+ исходник)</option>
      <option value="wav_delete">WAV (удалять исходник)</option>
    </select>
    <input id="musicRoot" placeholder="Корень библиотеки (общая папка, напр. E:\Music)">
    <button class="ghost" onclick="saveRoot()">Сохранить</button>
    <button class="ghost" onclick="sendReport()">🐞 Багрепорт</button>
  </div>
</header>
<main>
  <div id="side">
    <div id="tabs">
      <button id="tab-deezer" class="active" onclick="switchTab('deezer')">Deezer</button>
      <button id="tab-sc" onclick="switchTab('sc')">SoundCloud</button>
      <button id="tab-search" onclick="switchTab('search')">Поиск</button>
      <button id="tab-errors" onclick="switchTab('errors')">Ошибки</button>
    </div>
    <div id="sc-add">
      <input id="scUrl" placeholder="URL плейлиста/страницы SoundCloud (необязательно)">
      <button onclick="addScSource()">+</button>
    </div>
    <div id="playlists"></div>
  </div>
  <div id="content">
    <div id="toolbar" style="display:none">
      <div>
        <div id="pltitle"></div>
        <div id="plpath"></div>
      </div>
      <div class="spacer"></div>
      <span id="plstats" class="dim"></span>
      <label class="dim" style="font-size:12px" title="Файлы с номерами: 01 - Artist - Title">
        <input type="checkbox" id="numbering" onchange="saveNumbering()"> NN</label>
      <button class="ghost" onclick="rescan()">Пересканировать</button>
      <button class="ghost" onclick="bindPath()">Папка плейлиста…</button>
      <button onclick="downloadSelected()">Скачать выбранные</button>
      <button onclick="syncPlaylistOrder()" title="Перенумеровать файлы по порядку в стриминге и докачать недостающие">Синк: по порядку</button>
      <button onclick="syncAppend()" title="Не трогать текущие номера, новые треки — вниз списка">Синк: новые вниз</button>
      <button class="ghost" onclick="rbSync()" title="Синхронизировать скачанные треки в Rekordbox (Rekordbox должен быть закрыт)">→ RB</button>
      <button class="ghost" id="flipBtn" onclick="flipWav()" title="Конвертировать плейлист в WAV для CDJ с сохранением всех кью/сетки (Rekordbox закрыт)">⇄ WAV</button>
    </div>
    <div id="searchbar" style="display:none">
      <input id="searchInput" placeholder="Трек, альбом или исполнитель…" onkeydown="if(event.key==='Enter')runSearch()">
      <select id="searchService">
        <option value="both">Deezer + SC</option>
        <option value="deezer">Deezer</option>
        <option value="sc">SoundCloud</option>
      </select>
      <button onclick="runSearch()">Найти</button>
    </div>
    <div id="searchFilters">
      <span class="chip" data-f="all" onclick="setSearchFilter('all')">Все</span>
      <span class="chip" data-f="tracks" onclick="setSearchFilter('tracks')">Треки</span>
      <span class="chip" data-f="albums" onclick="setSearchFilter('albums')">Альбомы</span>
      <span class="chip" data-f="playlists" onclick="setSearchFilter('playlists')">Плейлисты/Сеты</span>
      <span class="chip" data-f="artists" onclick="setSearchFilter('artists')">Исполнители</span>
    </div>
    <div id="tracks"><div id="empty">Выберите плейлист слева</div></div>
  </div>
</main>
<div id="jobs"></div>

<div id="modalOverlay" style="display:none" onclick="if(event.target===this)closeLogin()">
  <div id="modal">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 id="loginTitle" style="font-size:16px"></h2>
      <button class="ghost" onclick="closeLogin()">×</button>
    </div>
    <div id="loginSteps" style="color:var(--dim);font-size:13px;margin:10px 0"></div>
    <input id="loginToken" style="width:100%;background:var(--panel2);border:1px solid #343743;color:var(--text);padding:8px 10px;border-radius:6px" placeholder="">
    <div style="display:flex;gap:8px;margin-top:12px;align-items:center">
      <button onclick="doLogin()">Войти</button>
      <span id="loginResult" style="font-size:13px"></span>
    </div>
    <div id="scImport" style="display:none;margin-top:14px;border-top:1px solid #2c2f3a;padding-top:10px">
      <div style="font-size:13px;margin-bottom:8px">Импортировать в источники:</div>
      <div id="scAccountList" style="max-height:200px;overflow-y:auto"></div>
      <button style="margin-top:8px" onclick="importScAccount()">Импортировать выбранные</button>
    </div>
  </div>
</div>

<script>
let current = null;   // {kind:'deezer'|'sc', id, title}
let tab = 'deezer';
let tracks = [];
let pollTimer = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDur = s => s ? `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}` : '—';

async function api(path, opts) {
  const r = await fetch(path, opts ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(opts.body||{})} : undefined);
  if (!r.ok) throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail);
  return r.json();
}

async function loadConfig() {
  const c = await api('/api/config');
  $('#musicRoot').value = c.music_root;
  $('#wavMode').value = c.wav_mode || 'source';
  $('#numbering').checked = !!c.numbering;
  $('#btnLoginDeezer').textContent = c.user && c.user.email ? `Deezer: ${c.user.email}` : 'Deezer: вход';
  $('#btnLoginDeezer').style.color = c.user && c.user.email ? 'var(--ok)' : '';
  $('#btnLoginSc').textContent = c.sc_user ? `SC: ${c.sc_user}` : 'SC: вход';
  $('#btnLoginSc').style.color = c.sc_user ? 'var(--ok)' : '';
}

// ---------- логин ----------
let loginService = 'deezer';

function openLogin(service) {
  loginService = service;
  $('#loginResult').textContent = '';
  $('#loginResult').style.color = '';
  $('#loginToken').value = '';
  $('#scImport').style.display = 'none';
  if (service === 'deezer') {
    $('#loginTitle').textContent = 'Вход в Deezer';
    $('#loginSteps').innerHTML = `1. Откройте <a href="https://www.deezer.com" target="_blank" style="color:var(--accent)">deezer.com</a> и войдите в аккаунт<br>
      2. F12 → Application → Cookies → <b>arl</b> — скопируйте значение<br>
      3. Вставьте ниже (в Tauri-версии это будет автоматически)`;
    $('#loginToken').placeholder = 'ARL cookie (192 символа)';
  } else {
    $('#loginTitle').textContent = 'Вход в SoundCloud';
    $('#loginSteps').innerHTML = `1. Откройте <a href="https://soundcloud.com" target="_blank" style="color:var(--accent)">soundcloud.com</a> и войдите<br>
      2. F12 → Application → Cookies → <b>oauth_token</b> — скопируйте значение<br>
      3. Вставьте ниже — подтянутся ваши плейлисты и лайки`;
    $('#loginToken').placeholder = 'oauth_token cookie';
  }
  $('#modalOverlay').style.display = 'flex';
  $('#loginToken').focus();
  // уже вошли в SC — сразу показываем список импорта
  if (service === 'sc' && $('#btnLoginSc').textContent.startsWith('SC: ') &&
      $('#btnLoginSc').style.color) {
    $('#loginResult').style.color = 'var(--ok)';
    $('#loginResult').textContent = '✔ уже выполнен вход — выберите, что импортировать';
    loadScAccount();
  }
}

function closeLogin() { $('#modalOverlay').style.display = 'none'; }

async function doLogin() {
  const token = $('#loginToken').value.trim();
  if (!token) return;
  const url = loginService === 'deezer' ? '/api/login/deezer' : '/api/login/soundcloud';
  const body = loginService === 'deezer' ? {arl: token} : {oauth_token: token};
  try {
    const r = await api(url, {body});
    $('#loginResult').style.color = 'var(--ok)';
    $('#loginResult').textContent = loginService === 'deezer'
      ? `✔ ${r.email}` : `✔ ${r.username}`;
    loadConfig();
    if (loginService === 'sc') loadScAccount();
    else { closeLogin(); loadPlaylists(); }
  } catch (e) {
    $('#loginResult').style.color = 'var(--err)';
    $('#loginResult').textContent = '✖ ' + e.message;
  }
}

async function loadScAccount() {
  try {
    const d = await api('/api/sc/account');
    const items = [d.likes, ...d.playlists];
    $('#scAccountList').innerHTML = items.map(p => `
      <label class="scacc"><input type="checkbox" class="scacc-cb"
        data-id="${p.id}" data-title="${esc(p.title)}" data-url="${esc(p.url)}" data-count="${p.count||0}">
        ${esc(p.title)} <span class="dim">(${p.count ?? '?'})</span></label>`).join('');
    $('#scImport').style.display = 'block';
  } catch (e) {
    $('#loginResult').style.color = 'var(--err)';
    $('#loginResult').textContent = 'аккаунт не загрузился: ' + e.message;
  }
}

async function importScAccount() {
  const items = [...document.querySelectorAll('.scacc-cb:checked')].map(c => ({
    id: c.dataset.id, title: c.dataset.title, url: c.dataset.url, count: +c.dataset.count}));
  if (!items.length) return;
  const r = await api('/api/sc/account/import', {body:{items}});
  alert(`Импортировано: ${r.added}`);
  closeLogin();
  switchTab('sc');
}

async function saveWavMode() {
  await api('/api/config', {body:{wav_mode: $('#wavMode').value}});
}

async function saveNumbering() {
  await api('/api/config', {body:{numbering: $('#numbering').checked}});
}

async function sendReport() {
  const text = prompt('Опишите проблему (что делали, что ожидали, что произошло):');
  if (!text) return;
  try {
    await api('/api/report', {body:{text, current: current ? current.title : tab}});
    alert('Репорт отправлен, спасибо!');
  } catch (e) {
    alert('Не отправилось: ' + e.message);
  }
}

async function saveRoot() {
  await api('/api/config', {body:{music_root: $('#musicRoot').value}});
  loadPlaylists();
  if (current) loadTracks(current);
}

async function loadPlaylists() {
  if (tab === 'sc') return loadScSources();
  if (tab === 'errors') return loadErrors();
  if (tab === 'search') return loadSearchTargets();
  const pls = await api('/api/playlists');
  $('#playlists').innerHTML = pls.map(p => `
    <div class="pl ${current && current.id===p.id?'active':''}" onclick="selectPlaylist('${p.id}', '${esc(p.title).replace(/'/g,"\\'")}')">
      ${p.cover ? `<img src="${p.cover}">` : '<img alt="">'}
      <div style="min-width:0">
        <div class="t">${esc(p.title)}</div>
        <div class="c">${p.ok||0}/${p.count} ${p.errors?`<span class="badge-err">⚠ ${p.errors}</span>`:''}</div>
      </div>
    </div>`).join('');
}

async function loadErrors() {
  const errs = await api('/api/errors');
  $('#playlists').innerHTML = (errs.length ? `
    <div style="padding:4px 8px"><button onclick="retryAll(${esc(JSON.stringify(errs.length))})" style="width:100%">Повторить все (${errs.length})</button></div>
    ` + errs.map((e,i) => `
    <div class="pl" style="cursor:default">
      <div style="min-width:0; flex:1">
        <div class="t">${esc(e.track.title)}</div>
        <div class="c">${esc(e.playlist_title)} · ${esc(e.track.artist)}</div>
        <div class="badge-err">${esc(e.error)}</div>
      </div>
      <button class="ghost" style="padding:4px 8px" onclick='retryOne(${JSON.stringify(i)})'>↻</button>
    </div>`).join('')
    : '<div id="empty">Ошибок нет 🎉</div>');
  window._errors = errs;
}

async function retryOne(i) {
  const e = window._errors[i];
  await api('/api/errors/retry', {body:{playlist_key:e.playlist_key, playlist_title:e.playlist_title, track:e.track}});
  startPolling();
}

async function retryAll() {
  for (const e of (window._errors||[])) {
    await api('/api/errors/retry', {body:{playlist_key:e.playlist_key, playlist_title:e.playlist_title, track:e.track}});
  }
  startPolling();
}

function switchTab(t) {
  tab = t;
  $('#tab-deezer').classList.toggle('active', t==='deezer');
  $('#tab-sc').classList.toggle('active', t==='sc');
  $('#tab-search').classList.toggle('active', t==='search');
  $('#tab-errors').classList.toggle('active', t==='errors');
  $('#sc-add').style.display = t==='sc' ? 'flex' : 'none';
  $('#searchbar').style.display = t==='search' ? 'flex' : 'none';
  $('#searchFilters').style.display = t==='search' ? 'flex' : 'none';
  current = null;
  $('#toolbar').style.display = 'none';
  if (t === 'search') {
    $('#tracks').innerHTML = '<div id="empty">Слева — цель (плейлист Deezer / источник SC / локальный плейлист / своя папка).<br>Ищите треки, отмечайте чекбоксами или качайте по одному. Альбомы и сеты раскрываются по клику — внутри треки качаются поштучно или все сразу.</div>';
    setSearchFilter(searchFilter);
    loadSearchTargets();
    return;
  }
  $('#tracks').innerHTML = t==='errors'
    ? '<div id="empty">Треки с ошибками загрузки/верификации — слева. Кнопка ↻ перезапускает сломавшийся этап.</div>'
    : '<div id="empty">Выберите ' + (t==='sc'?'источник':'плейлист') + ' слева</div>';
  loadPlaylists();
}

// ---------- поиск ----------
let searchTarget = null;   // {key,title,provider:'deezer'|'sc'|'local'|'dir',dir?}
let searchFilter = 'all';
let searchSel = {};        // "svc:tracks:i" -> track
let searchExpanded = {};   // "svc:i" -> {loading?, tracks?}

const provLabel = p => ({deezer:'Deezer', sc:'SoundCloud', local:'Локальный', dir:'Папка'})[p] || p;

async function loadSearchTargets() {
  const [dz, sc, loc] = await Promise.all([
    api('/api/playlists'), api('/api/sc/sources'), api('/api/local/playlists')]);
  const rows = [
    ...dz.map(p => ({key:p.id, title:p.title, provider:'deezer', count:p.count})),
    ...sc.map(s => ({key:'sc:'+s.id, title:s.title, provider:'sc', count:s.count})),
    ...loc.map(s => ({key:s.key, title:s.title, provider:'local', count:s.count})),
  ];
  if (!searchTarget && rows.length) searchTarget = rows[0];
  window._targets = rows;
  const cur = searchTarget
    ? `${provLabel(searchTarget.provider)} · ${esc(searchTarget.title)}`
    : 'не выбрана';
  $('#playlists').innerHTML = `
    <div id="targetBox">
      <div class="cap">Цель загрузки / добавления</div>
      <div class="cur" title="${cur}">${cur}</div>
      <div class="acts">
        <button class="ghost" onclick="createTargetPlaylist('deezer')" title="Новый плейлист в Deezer">＋Deezer</button>
        <button class="ghost" onclick="createTargetPlaylist('local')" title="Новый локальный плейлист (SoundCloud не даёт создавать плейлисты через API — создаётся локальная папка-плейлист, URL можно привязать позже)">＋Локальный (SC)</button>
        <button class="ghost" onclick="chooseCustomDir()" title="Скачивать в произвольную папку">📁 Папка…</button>
      </div>
    </div>` + rows.map((r,i) => `
    <div class="pl ${searchTarget && searchTarget.key===r.key?'active':''}" onclick="setSearchTarget(${i})">
      <img alt="">
      <div style="min-width:0">
        <div class="t">${esc(r.title)}</div>
        <div class="c">${provLabel(r.provider)} · ${r.count ?? '?'}</div>
      </div>
    </div>`).join('');
}

function setSearchTarget(i) {
  searchTarget = window._targets[i];
  loadSearchTargets();
}

async function chooseCustomDir() {
  const r = await api('/api/browse');
  if (!r.path) return;
  searchTarget = {key:'', title:r.path, provider:'dir', dir:r.path};
  loadSearchTargets();
}

async function createTargetPlaylist(kind) {
  if (kind === 'deezer') {
    const title = prompt('Название нового плейлиста в Deezer:');
    if (!title) return;
    const r = await api('/api/deezer/playlist/create', {body:{title, track_ids:[]}});
    searchTarget = {key:r.id, title:r.title, provider:'deezer'};
  } else {
    const title = prompt('Название локального плейлиста (папка в библиотеке; в SoundCloud плейлисты через API создавать нельзя):');
    if (!title) return;
    const r = await api('/api/local/playlists', {body:{title}});
    searchTarget = {key:r.key, title:r.title, provider:'local'};
  }
  loadSearchTargets();
}

function setSearchFilter(f) {
  searchFilter = f;
  document.querySelectorAll('#searchFilters .chip').forEach(c =>
    c.classList.toggle('active', c.dataset.f === f));
  if (window._search) renderSearch();
}

async function runSearch() {
  const q = $('#searchInput').value.trim();
  if (!q) return;
  searchSel = {}; searchExpanded = {};
  $('#tracks').innerHTML = '<div id="empty">Ищу…</div>';
  try {
    const d = await api(`/api/search?q=${encodeURIComponent(q)}&service=${$('#searchService').value}`);
    window._search = d;
    setSearchFilter(searchFilter);
  } catch (e) {
    $('#tracks').innerHTML = `<div id="empty">⚠ ${esc(e.message)}</div>`;
  }
}

function _selKey(svc, i) { return `${svc}:${i}`; }

function _trackCb(svc, i, t) {
  const k = _selKey(svc, i);
  if (searchSel[k]) delete searchSel[k]; else searchSel[k] = t;
  document.getElementById('cb-'+svc+'-'+i).checked = !!searchSel[k];
  _renderBasket();
}

function _renderBasket() {
  const n = Object.keys(searchSel).length;
  let b = document.getElementById('basket');
  if (!n) { if (b) b.remove(); return; }
  if (!b) {
    b = document.createElement('div');
    b.id = 'basket';
    $('#tracks').appendChild(b);
  }
  const tgt = searchTarget ? `${provLabel(searchTarget.provider)} · ${esc(searchTarget.title)}` : '—';
  b.innerHTML = `<b>${n} тр.</b>
    <button onclick="dlBasket()">⬇ в цель: ${tgt}</button>
    <button class="ghost" onclick="searchSel={};_renderBasket();renderSearch()">✕ очистить</button>`;
}

function _trackRow(svc, i, t, indent) {
  const checked = searchSel[_selKey(svc,i)] ? 'checked' : '';
  return `<div class="srow">
    <input type="checkbox" class="cb" id="cb-${svc}-${i}" ${checked} onclick="_trackCb('${svc}',${i},window._search['${svc}'].tracks[${i}])">
    <div class="tt" title="${esc(t.title)} — ${esc(t.artist)}">${esc(t.title)} <span class="meta">${esc(t.artist)} · ${fmtDur(t.duration)}</span></div>
    <span class="prov ${svc==='sc'?'sc':''}">${svc==='sc'?'SC':'DZ'}</span>
    ${svc==='deezer' ? `<button class="ghost" title="Добавить в плейлист Deezer без скачивания" onclick="addDzTrack(${i})">＋</button>` : ''}
    <button title="Скачать в цель" onclick="dlSearchTrack('${svc}',${i})">⬇</button>
  </div>`;
}

function _albumRow(svc, i, a) {
  const k = svc+':'+i;
  const exp = searchExpanded[k];
  const arrow = exp && exp.tracks ? '▾' : '▸';
  let html = `<div class="srow exp" onclick="toggleAlbum('${svc}',${i})">
    <div class="tt">${arrow} 💿 ${esc(a.title)} <span class="meta">${esc(a.artist)}${a.count?` · ${a.count} тр.`:''}</span></div>
    <span class="prov ${svc==='sc'?'sc':''}">${svc==='sc'?'SC':'DZ'}</span>
  </div>`;
  if (exp) {
    if (exp.loading) html += `<div class="stracks"><div class="srow dim">Загружаю треки…</div></div>`;
    else if (exp.error) html += `<div class="stracks"><div class="srow errtext">⚠ ${esc(exp.error)}</div></div>`;
    else if (exp.tracks) {
      html += `<div class="stracks">` + exp.tracks.map((t,j) => `
        <div class="srow">
          <div class="tt" title="${esc(t.title)} — ${esc(t.artist)}">${esc(t.title)} <span class="meta">${esc(t.artist)} · ${fmtDur(t.duration)}</span></div>
          <button title="Скачать в цель" onclick="dlAlbumTrack('${svc}',${i},${j})">⬇</button>
        </div>`).join('') +
        `<div class="srow"><div class="tt dim">${exp.tracks.length} тр.</div>
          <button onclick="dlWholeAlbum('${svc}',${i})">⬇ все</button></div></div>`;
    }
  }
  return html;
}

async function toggleAlbum(svc, i) {
  const k = svc+':'+i;
  if (searchExpanded[k] && !searchExpanded[k].loading) { delete searchExpanded[k]; renderSearch(); return; }
  searchExpanded[k] = {loading:true};
  renderSearch();
  try {
    const a = window._search[svc].albums[i];
    searchExpanded[k] = {tracks: svc === 'deezer'
      ? await api(`/api/deezer/album/${a.id}`)
      : await api(`/api/sc/resolve-tracks?url=${encodeURIComponent(a.url)}`)};
  } catch (e) {
    searchExpanded[k] = {error: e.message};
  }
  renderSearch();
}

function renderSearch() {
  const d = window._search || {};
  const f = searchFilter;
  let html = '';
  const sections = [];
  for (const [svc, label] of [['deezer','Deezer'],['sc','SoundCloud']]) {
    const s = d[svc];
    if (!s) continue;
    if ((f==='all'||f==='tracks') && s.tracks.length)
      sections.push([`${label} — треки`, s.tracks.map((t,i) => _trackRow(svc,i,t)).join('')]);
    const isPl = f==='playlists';
    if ((f==='all'||f==='albums'||isPl) && s.albums.length) {
      const kind = svc==='deezer' ? 'альбомы' : 'плейлисты и сеты';
      if (!(isPl && svc==='deezer'))
        sections.push([`${label} — ${kind}`, s.albums.map((a,i) => _albumRow(svc,i,a)).join('')]);
    }
    if ((f==='all'||f==='artists') && s.artists.length)
      sections.push([`${label} — исполнители`,
        s.artists.map(a => `<div class="srow"><div class="tt">👤 ${esc(a.name)}</div></div>`).join('')]);
  }
  html = sections.map(([t,rows]) => `<div class="search-sec">${t}</div>${rows}`).join('');
  $('#tracks').innerHTML = html || '<div id="empty">Ничего не найдено</div>';
  _renderBasket();
}

function _dlPayload(tracks) {
  if (!searchTarget) { alert('Слева выберите цель (плейлист или папку)'); return null; }
  if (searchTarget.provider === 'dir')
    return {target_key:'dir', target_title: searchTarget.title, target_dir: searchTarget.dir, tracks};
  return {target_key: searchTarget.key, target_title: searchTarget.title, tracks};
}

async function dlSearchTrack(svc, i) {
  const t = window._search[svc].tracks[i];
  const body = _dlPayload([{id:t.id, title:t.title, artist:t.artist, duration:t.duration, url:t.url, provider:svc}]);
  if (!body) return;
  const r = await api('/api/search/download', {body});
  if (r.added_to_deezer) console.log(`+${r.added_to_deezer} в плейлист Deezer`);
  startPolling();
}

async function dlAlbumTrack(svc, i, j) {
  const t = searchExpanded[svc+':'+i].tracks[j];
  const body = _dlPayload([{id:t.id, title:t.title, artist:t.artist, duration:t.duration, url:t.url, provider:svc}]);
  if (!body) return;
  await api('/api/search/download', {body});
  startPolling();
}

async function dlWholeAlbum(svc, i) {
  const a = window._search[svc].albums[i];
  const tracks = searchExpanded[svc+':'+i].tracks;
  const body = _dlPayload(tracks.map(t => ({id:t.id, title:t.title, artist:t.artist, duration:t.duration, url:t.url, provider:svc})));
  if (!body) return;
  await api('/api/search/download', {body});
  alert(`«${a.title}» поставлен в очередь (${tracks.length} треков)`);
  startPolling();
}

async function dlBasket() {
  const tracks = Object.values(searchSel).map(t => ({id:t.id, title:t.title, artist:t.artist, duration:t.duration, url:t.url, provider:t.provider}));
  const body = _dlPayload(tracks);
  if (!body) return;
  await api('/api/search/download', {body});
  alert(`Поставлено в очередь: ${tracks.length} тр.`);
  searchSel = {};
  _renderBasket();
  renderSearch();
  startPolling();
}

async function addDzTrack(i) {
  if (!searchTarget || searchTarget.provider !== 'deezer') {
    return alert('Выберите слева плейлист Deezer как цель');
  }
  const t = window._search.deezer.tracks[i];
  const r = await api('/api/deezer/playlist/add', {body:{playlist_id: searchTarget.key, track_ids:[t.id]}});
  alert(`«${t.title}» добавлен в «${searchTarget.title}»`);
}

async function loadScSources() {
  // автосинк аккаунта: свои + лайкнутые плейлисты + лайки (если выполнен вход)
  try { await api('/api/sc/sync-account', {body:{}}); } catch (e) { /* не вошли — ок */ }
  const srcs = await api('/api/sc/sources');
  $('#playlists').innerHTML = (srcs.map(s => `
    <div class="pl ${current && current.id===s.id?'active':''}" onclick="selectScSource('${s.id}', '${esc(s.title).replace(/'/g,"\\'")}')">
      <img alt="">
      <div style="min-width:0">
        <div class="t">${esc(s.title)}</div>
        <div class="c">${s.ok||0}/${s.count ?? '?'} ${s.errors?`<span class="badge-err">⚠ ${s.errors}</span>`:''}</div>
      </div>
    </div>`).join('')) || '<div id="empty">Войдите через «SC: вход» — плейлисты аккаунта появятся сами.<br>Или добавьте URL выше.</div>';
}

async function addScSource() {
  const url = $('#scUrl').value.trim();
  if (!url) return;
  $('#scUrl').value = '';
  try {
    await api('/api/sc/sources', {body:{url}});
  } catch (e) { alert(e.message); }
  loadPlaylists();
}

async function delScSource(id) {
  if (!confirm('Убрать источник из списка? (файлы останутся)')) return;
  await fetch(`/api/sc/sources/${id}`, {method:'DELETE'});
  if (current && current.id === id) { current = null; $('#toolbar').style.display='none'; }
  loadPlaylists();
}

function selectScSource(id, title) {
  current = {kind:'sc', id, title};
  loadPlaylists();
  loadTracks(current);
}

function selectPlaylist(id, title) {
  current = {kind:'deezer', id, title};
  loadPlaylists();
  loadTracks(current);
}

async function loadTracks(pl) {
  $('#toolbar').style.display = 'flex';
  $('#pltitle').textContent = pl.title;
  $('#tracks').innerHTML = '<div id="empty">Загрузка… (большие плейлисты — до ~20 сек)</div>';
  try {
    const url = pl.kind === 'sc'
      ? `/api/sc/sources/${pl.id}/tracks`
      : `/api/playlists/${pl.id}/tracks?title=${encodeURIComponent(pl.title)}`;
    const d = await api(url);
    tracks = d.tracks;
    $('#plpath').textContent = d.path;
    renderTracks();
  } catch (e) {
    $('#tracks').innerHTML = `<div id="empty">⚠ Не удалось загрузить: ${esc(e.message)}<br><br>
      <button class="ghost" onclick="rescan()">Повторить</button></div>`;
  }
}

function renderTracks() {
  const icon = {ok:'<span class="st ok">✔</span>', error:'<span class="st err">⚠</span>', missing:'<span class="st miss">✖</span>'};
  const ok = tracks.filter(t=>t.status==='ok').length;
  const err = tracks.filter(t=>t.status==='error').length;
  const miss = tracks.length - ok - err;
  $('#plstats').textContent = `✔ ${ok} · ✖ ${miss} · ⚠ ${err}`;
  const flipped = tracks.filter(t=>t.flipped).length;
  $('#flipBtn').textContent = flipped ? `⇄ FLAC (${flipped} в WAV)` : '⇄ WAV';
  $('#tracks').innerHTML = `<table>
    <tr><th><input type="checkbox" id="all" onchange="toggleAll(this.checked)"></th>
        <th></th><th>Название</th><th>Исполнитель</th><th>Альбом</th><th>⏱</th><th>Формат</th></tr>
    ${tracks.map((t,i) => `
    <tr>
      <td><input type="checkbox" class="trk" data-i="${i}" ${t.status==='ok'?'disabled':''}></td>
      <td>${icon[t.status]||''}</td>
      <td>${esc(t.title)}${t.error?`<div class="errtext">${esc(t.error)}</div>`:''}</td>
      <td>${esc(t.artist)}</td><td class="dim">${esc(t.album)}</td>
      <td class="dim">${fmtDur(t.duration)}</td>
      <td>${t.format?`<span class="fmt ${t.format}">${t.format}</span>`:''}${t.flipped?'<span class="fmt" style="background:#3a4a2e;color:#b8ff9e">→wav</span>':''}${t.mp3_source?'<span class="fmt" style="background:#4a3a2e;color:#ffd89e" title="mp3-источник: после конвертации в WAV кью могут сместиться на ~26 мс">mp3</span>':''}</td>
    </tr>`).join('')}
  </table>`;
}

function toggleAll(v) {
  document.querySelectorAll('.trk:not(:disabled)').forEach(c => c.checked = v);
}

function selectedTracks(onlyMissing = false) {
  const idxs = [...document.querySelectorAll('.trk:checked')].map(c => +c.dataset.i);
  let sel = idxs.map(i => tracks[i]);
  if (onlyMissing) sel = sel.filter(t => t.status !== 'ok');
  return sel.map(t => ({id:t.id, title:t.title, artist:t.artist, duration:t.duration, url:t.url, total:tracks.length}));
}

function downloadUrl(mode) {
  const base = current.kind === 'sc'
    ? `/api/sc/sources/${current.id}/download`
    : `/api/playlists/${current.id}/download?title=${encodeURIComponent(current.title)}`;
  return base + (base.includes('?') ? '&' : '?') + 'mode=' + mode;
}

async function downloadSelected() {
  const sel = selectedTracks(true);
  if (!sel.length) return alert('Ничего не выбрано (уже скачанные пропускаются)');
  await api(downloadUrl('append'), {body:{tracks:sel}});
  startPolling();
}

async function syncPlaylistOrder() {
  // 1) перенумеровать существующие файлы по порядку стриминга
  const order = tracks.map(t => t.id);
  const key = current.kind === 'sc' ? 'sc:' + current.id : current.id;
  const rn = await api(`/api/playlists/${key}/renumber?title=${encodeURIComponent(current.title)}`,
                       {body:{order, total: tracks.length}});
  // 2) докачать недостающие с позициями из плейлиста
  const missing = tracks.filter(t => t.status !== 'ok')
    .map((t) => ({id:t.id, title:t.title, artist:t.artist, duration:t.duration, url:t.url,
                  position: tracks.indexOf(t)+1, total: tracks.length}));
  if (!missing.length) {
    alert(`Порядок применён (переименовано: ${rn.renamed}). Всё уже скачано.`);
    rescan(); return;
  }
  if (!confirm(`Перенумеровано: ${rn.renamed}. Скачать ${missing.length} треков?`)) { rescan(); return; }
  await api(downloadUrl('playlist_order'), {body:{tracks:missing}});
  startPolling();
}

async function syncAppend() {
  const missing = tracks.filter(t => t.status !== 'ok')
    .map(t => ({id:t.id, title:t.title, artist:t.artist, duration:t.duration, url:t.url, total:tracks.length}));
  if (!missing.length) return alert('Всё уже скачано');
  if (!confirm(`Скачать ${missing.length} треков (новые — вниз списка)?`)) return;
  await api(downloadUrl('append'), {body:{tracks:missing}});
  startPolling();
}

async function rbSync() {
  const key = current.kind === 'sc' ? 'sc:' + current.id : current.id;
  if (!confirm(`Синхронизировать «${current.title}» в Rekordbox?\nRekordbox должен быть ЗАКРЫТ. Бэкап master.db будет создан автоматически.`)) return;
  try {
    const r = await api('/api/rb/sync', {body:{playlist_key:key, playlist_title:current.title}});
    alert(`Готово: плейлист «${r.playlist}»\nновых треков в коллекции: ${r.added_content}\nдобавлено в плейлист: ${r.added_to_playlist}\n\n${r.note}`);
  } catch (e) {
    alert('⚠ ' + e.message);
  }
}

async function flipWav() {
  const flipped = tracks.filter(t => t.flipped).length;
  const to_wav = flipped === 0;
  const msg = to_wav
    ? `Конвертировать «${current.title}» в WAV для CDJ?\nВсе кью, сетка, BPM и порядок сохранятся (пути в master.db переключатся на WAV).\nRekordbox должен быть ЗАКРЫТ.`
    : `Вернуть «${current.title}» к исходникам (FLAC/MP3)?\nПути в master.db переключатся обратно. Rekordbox должен быть ЗАКРЫТ.`;
  if (!confirm(msg)) return;
  const key = current.kind === 'sc' ? 'sc:' + current.id : current.id;
  await api('/api/flip', {body:{playlist_key:key, playlist_title:current.title, to_wav}});
  startPolling();
}

async function bindPath() {
  // нативный диалог выбора папки; fallback — ручной ввод с текущим путём
  let p = null, browseFailed = false;
  try {
    const b = await api('/api/browse');
    p = b.path;
  } catch (e) { browseFailed = true; }
  if (!p && browseFailed) {
    p = prompt('Папка для этого плейлиста (например на флешке E:\\Playlists\\Set):', $('#plpath').textContent);
  }
  if (!p) return;
  const key = current.kind === 'sc' ? 'sc:' + current.id : current.id;
  await api(`/api/playlists/${key}/bind`, {body:{path:p}});
  await loadTracks(current);   // сразу сканируем новую папку
  loadPlaylists();
}

async function rescan() {
  if (!current) return;
  await loadTracks(current);
  loadPlaylists();
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    const js = await api('/api/jobs');
    const active = js.filter(j => j.state !== 'done');
    $('#jobs').innerHTML = js.slice(0,5).map(j => `
      <div class="job"><b>${esc(j.title)}</b>: ${j.done}/${j.total}
        ${j.failed?`<span class="err">(ошибок: ${j.failed})</span>`:''}
        ${j.current?`<span class="dim"> — ${esc(j.current)}</span>`:''}
        <div class="bar"><i style="width:${j.total?100*j.done/j.total:0}%"></i></div>
      </div>`).join('');
    if (!active.length) {
      clearInterval(pollTimer); pollTimer = null;
      if (current) loadTracks(current);
      loadPlaylists();
    }
  }, 1500);
}

loadConfig();
loadPlaylists();
</script>
</body>
</html>
