[package]
name = "deckpipe"
version = "0.6.0"
description = "DeckPipe — синк Deezer/SoundCloud с локальной DJ-библиотекой и Rekordbox"
authors = ["pavlovsd0g"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
auth-host-only = []

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "=2.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rand = "=0.8.5"
hex = "=0.4.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_RemoteDesktop"] }

[profile.release]
lto = true
opt-level = "s"
