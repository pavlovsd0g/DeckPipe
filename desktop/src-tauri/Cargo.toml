[package]
name = "deckpipe"
version = "0.5.0"
description = "DeckPipe — синк Deezer/SoundCloud с локальной DJ-библиотекой и Rekordbox"
authors = ["pavlovsd0g"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
opt-level = "s"
