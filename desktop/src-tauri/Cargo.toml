[package]
name = "deckpipe"
default-run = "deckpipe"
version = "0.6.0"
description = "DeckPipe — синк Deezer/SoundCloud с локальной DJ-библиотекой и Rekordbox"
authors = ["pavlovsd0g"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "=2.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rand = "=0.8.5"
hex = "=0.4.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["json"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = "=0.61.3"

[profile.release]
lto = true
opt-level = "s"
